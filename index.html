<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAF9F5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#262624" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Amodel — one API key for Claude, GPT, Gemini and friends." />
    <title>Amodel</title>
    <style>
      /*
       * Boot splash. Inline so it paints in the very first frame, before
       * the main CSS bundle has loaded. The script in main.ts removes it
       * after Vue mounts. Colours mirror the Claude design system; the
       * media queries handle dark mode WITHOUT JS so OS-dark visitors
       * don't see a flash of cream-white background.
       */
      html, body { margin: 0; padding: 0; background: #FAF9F5; }
      @media (prefers-color-scheme: dark) {
        html, body { background: #262624; }
      }
      #app-boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #FAF9F5;
        color: #1F1E1B;
        z-index: 9999;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        transition: opacity 0.25s ease-out;
      }
      @media (prefers-color-scheme: dark) {
        #app-boot { background: #262624; color: #F1EDE2; }
      }
      .boot-stack { display: flex; flex-direction: column; align-items: center; gap: 28px; }
      .boot-brand { display: flex; align-items: center; gap: 12px; opacity: 0; animation: boot-fade 0.4s ease-out 0.05s forwards; }
      .boot-chip {
        width: 32px; height: 32px; border-radius: 6px;
        background: #C15F3C; color: #fff;
        display: flex; align-items: center; justify-content: center;
        font-family: ui-serif, Georgia, serif; font-size: 14px;
      }
      @media (prefers-color-scheme: dark) {
        .boot-chip { background: #D97757; color: #1F1E1B; }
      }
      .boot-name { font-family: ui-serif, Georgia, serif; font-size: 20px; letter-spacing: -0.01em; }
      .boot-spinner {
        width: 22px; height: 22px;
        border: 2px solid rgba(31, 30, 27, 0.12);
        border-top-color: #C15F3C;
        border-radius: 50%;
        animation: boot-spin 0.85s linear infinite;
      }
      @media (prefers-color-scheme: dark) {
        .boot-spinner { border-color: rgba(241, 237, 226, 0.12); border-top-color: #D97757; }
      }
      .boot-hint {
        font-size: 12px; color: #6B6760;
        opacity: 0; animation: boot-fade 0.4s ease-out 0.7s forwards;
      }
      @media (prefers-color-scheme: dark) {
        .boot-hint { color: #A8A296; }
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @keyframes boot-fade { to { opacity: 1; } }
      #app-boot.is-hidden { opacity: 0; pointer-events: none; }
      @media (prefers-reduced-motion: reduce) {
        .boot-spinner { animation: none; }
        .boot-brand, .boot-hint { animation: none; opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="app-boot" aria-hidden="true" role="presentation">
      <div class="boot-stack">
        <div class="boot-brand">
          <div class="boot-chip">A</div>
          <span class="boot-name">Amodel</span>
        </div>
        <div class="boot-spinner"></div>
        <div class="boot-hint">Loading…</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
